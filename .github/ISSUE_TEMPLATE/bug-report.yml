name: Bug report
description: Report something in eLOG that is not working correctly.
title: "[Bug] "
labels: ["bug", "beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        GitHub issues are public. Do not attach trade screenshots, balances, account details, or exported eLOG data.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. See…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: eLOG version
      placeholder: Beta 0.2.0
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Windows
        - macOS
        - Android phone
        - Android tablet
        - iPhone
        - iPad
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private trading and personal information from this report.
          required: true
